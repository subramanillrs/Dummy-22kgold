name: Update 22K Gold Price

on:
  schedule:
    # 10:00 AM IST
    - cron: "30 4 * * 1-6"

    # 4:00 PM IST
    - cron: "30 10 * * 1-6"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update gold price
        run: node scripts/update-gold-rate.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/gold-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated gold data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gold-history.json

          git commit -m "Update 22K gold price"

          git push
